<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Menu Analyzer</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1410;
    --paper: #f5f0e8;
    --rice: #ede7d9;
    --muted: #8a7e70;
    --border: rgba(26,20,16,0.1);
    --accent: #3a8c5e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f0ebe0;
      --paper: #1a1814;
      --rice: #2a2520;
      --muted: #9a8e80;
      --border: rgba(240,235,224,0.12);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--paper); color: var(--ink); font-family: 'Cormorant Garamond', Georgia, serif; min-height: 100vh; }

  /* ── Upload screen ─────────────────────────────────────────────────────── */
  #upload-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 2rem 1.5rem;
  }
  .app-brand { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.3rem; }
  .app-title { font-size: 2.2rem; font-weight: 300; font-style: italic; line-height: 1.1; margin-bottom: 0.5rem; }
  .app-sub { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.05em; color: var(--muted); line-height: 1.6; margin-bottom: 2.5rem; }

  .upload-zone {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 1.5px dashed var(--border);
    border-radius: 16px;
    padding: 2.5rem 1.5rem;
    cursor: pointer;
    transition: border-color 0.2s;
    min-height: 280px;
    position: relative;
  }
  .upload-zone.drag-over { border-color: var(--accent); }
  .upload-zone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }

  .upload-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.4; }
  .upload-primary { font-size: 1.4rem; font-weight: 300; font-style: italic; margin-bottom: 0.5rem; color: var(--ink); }
  .upload-secondary { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

  .preview-wrap { position: relative; width: 100%; }
  .preview-img { width: 100%; max-height: 300px; object-fit: contain; border-radius: 8px; display: block; }
  .preview-clear {
    position: absolute; top: 8px; right: 8px;
    background: var(--paper); border: 1px solid var(--border);
    border-radius: 50%; width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted);
    cursor: pointer; pointer-events: all;
  }

  .analyze-btn {
    margin-top: 1.5rem;
    width: 100%; padding: 14px;
    background: var(--ink); color: var(--paper);
    border: none; border-radius: 10px;
    font-family: 'DM Mono', monospace; font-size: 11px;
    letter-spacing: 0.12em; text-transform: uppercase;
    cursor: pointer; transition: opacity 0.15s;
  }
  .analyze-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .analyze-btn:not(:disabled):active { opacity: 0.7; }

  .restore-btn {
    margin-top: 0.9rem;
    width: 100%; padding: 10px;
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 10px;
    font-family: 'DM Mono', monospace; font-size: 9.5px;
    letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer; transition: opacity 0.15s;
    display: none;
  }
  .restore-btn:active { opacity: 0.6; }

  /* ── Progress screen ───────────────────────────────────────────────────── */
  #progress-screen {
    display: none;
    min-height: 100vh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    text-align: center;
  }
  .progress-title { font-size: 1.6rem; font-weight: 300; font-style: italic; margin-bottom: 0.75rem; }
  .progress-status { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 2rem; min-height: 1.5em; }
  .progress-bar-wrap { width: 100%; max-width: 280px; height: 3px; background: var(--rice); border-radius: 2px; overflow: hidden; margin-bottom: 1rem; }
  .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; width: 0%; }
  .progress-count { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--muted); margin-bottom: 2rem; }
  .cancel-btn {
    font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); cursor: pointer;
  }
  .cancel-btn:active { opacity: 0.6; }

  /* ── Results screen ────────────────────────────────────────────────────── */
  #results-screen { display: none; }

  header {
    padding: 1.5rem 1.25rem 0.9rem;
    border-bottom: 1px solid var(--border);
    background: var(--paper);
    position: sticky; top: 0; z-index: 10;
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem; }
  .brand { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .new-btn {
    font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); cursor: pointer;
  }
  .title { font-size: 1.9rem; font-weight: 300; font-style: italic; line-height: 1; margin-bottom: 0.9rem; }

  .filters { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; scrollbar-width: none; margin-bottom: 0.6rem; }
  .filters::-webkit-scrollbar { display: none; }
  .pill {
    flex-shrink: 0; font-family: 'DM Mono', monospace; font-size: 9.5px;
    letter-spacing: 0.06em; text-transform: uppercase;
    padding: 5px 12px; border-radius: 20px;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); cursor: pointer; transition: all 0.15s;
  }
  .pill.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .sort-row { display: flex; align-items: center; gap: 8px; }
  .sort-label { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); flex-shrink: 0; }
  select {
    font-family: 'DM Mono', monospace; font-size: 9.5px; padding: 4px 8px;
    border-radius: 6px; border: 1px solid var(--border);
    background: var(--paper); color: var(--ink); cursor: pointer; flex: 1;
  }

  main { padding: 0.25rem 1.25rem 5rem; }
  .card { padding: 1.25rem 0; border-bottom: 1px solid var(--border); }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 1rem; }
  .drink-name { font-size: 1.3rem; font-weight: 400; font-style: italic; line-height: 1.2; }
  .drink-meta { font-family: 'DM Mono', monospace; font-size: 8px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 5px; }

  .grade-tag {
    font-family: 'DM Mono', monospace; font-size: 8.5px; letter-spacing: 0.05em;
    padding: 4px 9px; border-radius: 4px; white-space: nowrap; flex-shrink: 0;
    text-transform: uppercase; margin-top: 2px;
  }
  .tag-red      { background: #3d1515; color: #e07878; }
  .tag-white    { background: #2d2d10; color: #d4d070; }
  .tag-rose     { background: #3d1530; color: #e078c0; }
  .tag-sparkling{ background: #10303d; color: #70c8e0; }
  .tag-sake     { background: #1a2d1a; color: #70c870; }
  .tag-whisky   { background: #3d2810; color: #e0a870; }
  .tag-beer     { background: #2d2510; color: #d4b860; }
  .tag-spirits  { background: #201030; color: #b090e0; }
  .tag-other    { background: var(--rice); color: var(--muted); border: 1px solid var(--border); }
  @media (prefers-color-scheme: light) {
    .tag-red      { background: #f6e8e8; color: #7a2020; }
    .tag-white    { background: #f6f6e0; color: #5a5a10; }
    .tag-rose     { background: #f6e8f2; color: #7a2060; }
    .tag-sparkling{ background: #e0f2f6; color: #107080; }
    .tag-sake     { background: #e4f0e8; color: #2a5c3e; }
    .tag-whisky   { background: #f6f0e8; color: #7a4810; }
    .tag-beer     { background: #f6f2e0; color: #5a4a10; }
    .tag-spirits  { background: #ede8f6; color: #402060; }
  }

  .pill-row { display: flex; gap: 8px; margin-bottom: 0.9rem; }
  .info-pill { background: var(--rice); border-radius: 20px; padding: 6px 14px; display: flex; flex-direction: column; align-items: center; flex: 1; }
  .ip-label { font-family: 'DM Mono', monospace; font-size: 7.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
  .ip-val { font-size: 1.1rem; font-weight: 400; line-height: 1; color: var(--ink); }
  .ip-sub { font-family: 'DM Mono', monospace; font-size: 7.5px; color: var(--muted); margin-top: 2px; }

  .abv-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: middle; position: relative; top: -1px; }
  .dot-low  { background: #3a8c5e; }
  .dot-mid  { background: #b87333; }
  .dot-high { background: #9e3030; }

  .pairings-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 0.85rem; }
  .pairing-tag {
    font-family: 'DM Mono', monospace; font-size: 8.5px; letter-spacing: 0.03em;
    padding: 3px 9px; border-radius: 20px;
    border: 1px solid var(--border); color: var(--muted);
  }

  .spirits-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 0.75rem;
    font-family: 'DM Mono', monospace; font-size: 8.5px; color: var(--muted);
  }
  .spirits-label { letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.6; flex-shrink: 0; }
  .spirits-list { letter-spacing: 0.02em; }

  .apd-block { border-radius: 8px; padding: 13px 15px; margin-bottom: 0.9rem; border: 1px solid var(--border); }
  .apd-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .apd-label { font-family: 'DM Mono', monospace; font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .apd-rank { font-family: 'DM Mono', monospace; font-size: 8.5px; padding: 2px 8px; border-radius: 3px; }
  .rank-1 { background: #c8a054; color: #1a0800; }
  .rank-2 { background: #707068; color: #f0ece0; }
  .rank-3 { background: #906858; color: #f0ece0; }
  .rank-n { color: var(--muted); }

  .apd-main { display: flex; align-items: baseline; gap: 6px; margin-bottom: 5px; }
  .apd-number { font-size: 2.6rem; font-weight: 300; line-height: 1; }
  .apd-unit-inline { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--muted); }
  .apd-detail { font-family: 'DM Mono', monospace; font-size: 8px; color: var(--muted); letter-spacing: 0.03em; }
  .bar-track { height: 3px; background: rgba(128,128,128,0.2); border-radius: 2px; margin-top: 10px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 2px; }
  .apd-na { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--muted); font-style: italic; padding: 8px 0; }

  .flavor { font-size: 1rem; line-height: 1.55; color: var(--ink); font-weight: 300; margin-bottom: 0.4rem; }
  .compare { font-family: 'DM Mono', monospace; font-size: 8.5px; letter-spacing: 0.02em; line-height: 1.65; color: var(--muted); }
  .compare::before { content: '≈  '; }

  .empty { text-align: center; padding: 3rem 0; color: var(--muted); font-style: italic; font-size: 1.1rem; }

  footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--paper); border-top: 1px solid var(--border);
    padding: 0.6rem 1.25rem;
    display: flex; gap: 14px; align-items: center;
  }
  .leg { display: flex; align-items: center; gap: 5px; font-family: 'DM Mono', monospace; font-size: 8px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
  .leg-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
</style>
</head>
<body>

<!-- ── Upload Screen ────────────────────────────────────────────────────────── -->
<div id="upload-screen">
  <div class="app-brand">Menu Analyzer</div>
  <div class="app-title">photograph<br>your menu</div>
  <div class="app-sub">Take a photo of any drink menu.<br>Get instant analysis — ABV, value, calories, pairings.</div>

  <div class="upload-zone" id="upload-zone">
    <input type="file" id="file-input" accept="image/*" capture="environment">
    <div id="upload-placeholder">
      <div class="upload-icon">📷</div>
      <div class="upload-primary">tap to photograph</div>
      <div class="upload-secondary">or drag & drop an image</div>
    </div>
    <div id="preview-container" style="display:none; width:100%; pointer-events:none;">
      <img id="preview-img" class="preview-img" alt="Menu preview">
      <button class="preview-clear" id="clear-btn" style="pointer-events:all;">✕</button>
    </div>
  </div>

  <button class="analyze-btn" id="analyze-btn" disabled>Analyze Menu</button>
  <button class="restore-btn" id="restore-btn">Restore last results</button>
</div>

<!-- ── Progress Screen ─────────────────────────────────────────────────────── -->
<div id="progress-screen">
  <div class="progress-title">analyzing...</div>
  <div class="progress-status" id="progress-status">Reading menu</div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progress-bar"></div>
  </div>
  <div class="progress-count" id="progress-count"></div>
  <button class="cancel-btn" id="cancel-btn">Cancel</button>
</div>

<!-- ── Results Screen ─────────────────────────────────────────────────────── -->
<div id="results-screen">
  <header>
    <div class="header-top">
      <span class="brand" id="result-brand">Menu Analyzer</span>
      <button class="new-btn" id="new-btn">New menu</button>
    </div>
    <div class="title" id="result-title">drink guide</div>
    <div class="filters" id="filters"></div>
    <div class="sort-row">
      <span class="sort-label">Sort</span>
      <select id="sorter">
        <option value="default">Default order</option>
        <option value="apd_desc">Best value — Value Index</option>
        <option value="abv_desc">Highest ABV</option>
        <option value="price_asc">Lowest bottle price</option>
        <option value="cals_asc">Lowest calories</option>
      </select>
    </div>
  </header>

  <main id="cards"></main>

  <footer>
    <div class="leg"><span class="leg-dot" style="background:#3a8c5e"></span>High value</div>
    <div class="leg"><span class="leg-dot" style="background:#b87333"></span>Mid</div>
    <div class="leg"><span class="leg-dot" style="background:#9e3030"></span>Low value</div>
    <div style="margin-left:auto;font-family:'DM Mono',monospace;font-size:8px;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted);">Value Index 0–100</div>
  </footer>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let allDrinks    = [];
let currentCat   = 'all';
let currentSort  = 'default';
let selectedFile = null;
let abortCtrl    = null;

const BOTTLE_ML  = 750;
const STORAGE_KEY = 'menuAnalyzer_results';

// ── Upload screen logic ───────────────────────────────────────────────────────
const fileInput   = document.getElementById('file-input');
const uploadZone  = document.getElementById('upload-zone');
const analyzeBtn  = document.getElementById('analyze-btn');
const restoreBtn  = document.getElementById('restore-btn');
const previewCont = document.getElementById('preview-container');
const previewImg  = document.getElementById('preview-img');
const placeholder = document.getElementById('upload-placeholder');
const clearBtn    = document.getElementById('clear-btn');
const cancelBtn   = document.getElementById('cancel-btn');

fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) setFile(file);
});

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) setFile(file);
});

clearBtn.addEventListener('click', e => {
  e.stopPropagation();
  clearFile();
});

cancelBtn.addEventListener('click', () => {
  if (abortCtrl) abortCtrl.abort();
  showScreen('upload');
});

function setFile(file) {
  selectedFile = file;
  const reader = new FileReader();
  reader.onload = ev => {
    previewImg.src = ev.target.result;
    placeholder.style.display = 'none';
    previewCont.style.display = 'block';
    analyzeBtn.disabled = false;
  };
  reader.readAsDataURL(file);
}

function clearFile() {
  selectedFile = null;
  fileInput.value = '';
  previewImg.src = '';
  previewCont.style.display = 'none';
  placeholder.style.display = 'flex';
  placeholder.style.flexDirection = 'column';
  placeholder.style.alignItems = 'center';
  analyzeBtn.disabled = true;
}

// ── localStorage restore ──────────────────────────────────────────────────────
function loadSaved() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch { return null; }
}

function saveResults(drinks, venue) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ drinks, venue, savedAt: Date.now() }));
  } catch {}
}

// Show restore button if there are saved results
const saved = loadSaved();
if (saved) {
  const date = new Date(saved.savedAt);
  const label = saved.venue
    ? `Restore: ${saved.venue} (${date.toLocaleDateString()})`
    : `Restore last results (${date.toLocaleDateString()})`;
  restoreBtn.textContent = label;
  restoreBtn.style.display = 'block';
}

restoreBtn.addEventListener('click', () => {
  const s = loadSaved();
  if (s) showResults(s.drinks, s.venue);
});

// ── Analysis ──────────────────────────────────────────────────────────────────
analyzeBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  showScreen('progress');

  const progressBar    = document.getElementById('progress-bar');
  const progressStatus = document.getElementById('progress-status');
  const progressCount  = document.getElementById('progress-count');

  progressBar.style.width = '0%';
  progressCount.textContent = '';

  abortCtrl = new AbortController();

  const formData = new FormData();
  formData.append('menu', selectedFile);

  try {
    const response = await fetch('/analyze', {
      method: 'POST',
      body: formData,
      signal: abortCtrl.signal
    });

    if (!response.ok) throw new Error(`Server error: ${response.status}`);

    const reader  = response.body.getReader();
    const decoder = new TextDecoder();
    let   buffer  = '';
    let   total   = 0;

    const processChunk = (chunk) => {
      buffer += chunk;
      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        const lines = part.split('\n');
        let event   = 'message';
        let data    = '';

        for (const line of lines) {
          if (line.startsWith('event:')) event = line.slice(6).trim();
          if (line.startsWith('data:'))  data  = line.slice(5).trim();
        }

        if (!data) continue;

        try {
          const payload = JSON.parse(data);

          if (event === 'status') {
            progressStatus.textContent = payload.message;
          } else if (event === 'count') {
            total = payload.total;
            progressBar.style.width = '15%';
          } else if (event === 'progress') {
            const pct = payload.done === payload.total ? 90 : 15;
            progressBar.style.width = pct + '%';
            if (payload.done === payload.total) {
              progressCount.textContent = `${payload.total} drinks researched`;
            }
          } else if (event === 'complete') {
            progressBar.style.width = '100%';
            setTimeout(() => showResults(payload.drinks, payload.venue), 400);
          } else if (event === 'error') {
            throw new Error(payload.message);
          }
        } catch (parseErr) {
          if (parseErr.message && !parseErr.message.includes('JSON')) throw parseErr;
        }
      }
    };

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      processChunk(decoder.decode(value, { stream: true }));
    }

  } catch (err) {
    if (err.name === 'AbortError') return; // user cancelled — already back on upload screen
    showScreen('upload');
    alert('Analysis failed: ' + err.message);
  } finally {
    abortCtrl = null;
  }
});

// ── Value Index ───────────────────────────────────────────────────────────────
function broadCat(category) {
  if (!category) return 'other';
  if (category.startsWith('wine_') || category === 'sake') return 'wine';
  if (category === 'beer') return 'beer';
  return 'other';
}

function computeValueIndex(drinks) {
  const groups = {};
  drinks.forEach(d => {
    const g = broadCat(d.category);
    if (!groups[g]) groups[g] = [];
    if (d.apd) groups[g].push(d);
  });

  const result = {};
  Object.entries(groups).forEach(([g, list]) => {
    const apds = list.map(d => d.apd);
    const min  = Math.min(...apds);
    const max  = Math.max(...apds);
    const range = max - min;
    list.forEach(d => {
      result[d.name] = {
        score: range === 0 ? 100 : Math.round(((d.apd - min) / range) * 100),
        rank:  list.filter(x => x.apd > d.apd).length + 1,
        total: list.length,
        group: g
      };
    });
  });
  return result;
}

// ── Results rendering ─────────────────────────────────────────────────────────
function showResults(drinks, venue) {
  const valueIndex = computeValueIndex(drinks);
  allDrinks = drinks.map(d => ({ ...d, _vi: valueIndex[d.name] || null }));

  // Save to localStorage
  saveResults(drinks, venue);
  // Update restore button
  if (venue) {
    restoreBtn.textContent = `Restore: ${venue} (${new Date().toLocaleDateString()})`;
  } else {
    restoreBtn.textContent = `Restore last results (${new Date().toLocaleDateString()})`;
  }
  restoreBtn.style.display = 'block';

  // Build category filter pills
  const cats    = ['all', ...new Set(drinks.map(d => d.category).filter(Boolean))];
  const filterEl = document.getElementById('filters');
  filterEl.innerHTML = cats.map(c =>
    `<button class="pill ${c === 'all' ? 'active' : ''}" data-cat="${c}">${c === 'all' ? 'All' : formatCat(c)}</button>`
  ).join('');

  // Show venue name if we have it
  document.getElementById('result-title').textContent = venue ? venue.toLowerCase() : 'drink guide';

  currentCat  = 'all';
  currentSort = 'default';
  document.getElementById('sorter').value = 'default';

  showScreen('results');
  renderCards();
}

function formatCat(c) {
  return c.replace(/_/g, ' ').replace('wine ', '');
}


function markupColor(x) {
  if (x <= 2.0) return '#3a8c5e';
  if (x <= 2.5) return '#b87333';
  return '#9e3030';
}

function getFiltered() {
  if (currentCat === 'all') return [...allDrinks];
  return allDrinks.filter(d => d.category === currentCat);
}

function getSorted(list) {
  const l = [...list];
  if (currentSort === 'apd_desc')  return l.filter(d => d.apd).sort((a,b) => b.apd - a.apd);
  if (currentSort === 'abv_desc')  return l.sort((a,b) => (b.abv||0) - (a.abv||0));
  if (currentSort === 'price_asc') return l.filter(d => d.bottle_price).sort((a,b) => a.bottle_price - b.bottle_price);
  if (currentSort === 'cals_asc')  return l.filter(d => d.calories_per_pour).sort((a,b) => a.calories_per_pour - b.calories_per_pour);
  return l;
}


function renderCards() {
  const filtered  = getFiltered();
  const sorted    = getSorted(filtered);

  if (!sorted.length) {
    document.getElementById('cards').innerHTML = '<div class="empty">Nothing in this category</div>';
    return;
  }

  document.getElementById('cards').innerHTML = sorted.map(d => {
    const abvLevel = !d.abv ? 'mid' : d.abv < 13 ? 'low' : d.abv > 16 ? 'high' : 'mid';
    const tag      = d.tag_class || 'tag-other';
    const catLabel = formatCat(d.category || 'other');
    const meta     = [d.region, d.subcategory].filter(Boolean).join(' · ');
    const POURS    = BOTTLE_ML / (d.pour_ml || 148);

    // Value Index block
    let apdHTML;
    if (d._vi) {
      const vi     = d._vi;
      const color  = vi.score >= 70 ? '#3a8c5e' : vi.score >= 40 ? '#b87333' : '#9e3030';
      const group  = vi.group === 'wine' ? 'wines' : vi.group === 'beer' ? 'beers' : 'drinks';
      apdHTML = `
        <div class="apd-block" style="background:${color}18;border-color:${color}35;">
          <div class="apd-top">
            <span class="apd-label">Value Index · ranked among ${group}</span>
            <span class="apd-rank ${vi.rank === 1 ? 'rank-1' : vi.rank === 2 ? 'rank-2' : vi.rank === 3 ? 'rank-3' : 'rank-n'}">#${vi.rank} of ${vi.total}</span>
          </div>
          <div class="apd-main">
            <span class="apd-number" style="color:${color}">${vi.score}</span>
            <span class="apd-unit-inline">/ 100</span>
          </div>
          <div class="apd-detail">$${d.pour_price.toFixed(2)} per pour · ${Math.round((d.abv||0)/100*(d.pour_ml||148))}ml pure alcohol</div>
        </div>`;
    } else {
      apdHTML = `
        <div class="apd-block" style="opacity:0.4">
          <div class="apd-label">Value Index</div>
          <div class="apd-na">No price on menu</div>
        </div>`;
    }


    const pairingsHTML = d.food_pairings?.length
      ? `<div class="pairings-row">${d.food_pairings.map(p => `<span class="pairing-tag">${p}</span>`).join('')}</div>`
      : '';

    return `
    <div class="card">
      <div class="card-top">
        <div>
          <div class="drink-name">${d.name}</div>
          ${meta ? `<div class="drink-meta">${meta}</div>` : ''}
        </div>
        <span class="grade-tag ${tag}">${catLabel}</span>
      </div>

      <div class="pill-row">
        <div class="info-pill">
          <div class="ip-label">ABV</div>
          <div class="ip-val">${d.abv ? `<span class="abv-dot dot-${abvLevel}"></span>${d.abv}%` : '—'}</div>
        </div>
        <div class="info-pill">
          <div class="ip-label">Bottle</div>
          <div class="ip-val">${d.bottle_price ? '$' + d.bottle_price : '—'}</div>
          ${d.bottle_price ? `<div class="ip-sub">~${POURS.toFixed(1)} pours</div>` : ''}
        </div>
        <div class="info-pill">
          <div class="ip-label">Markup</div>
          <div class="ip-val" style="color:${d.markup ? markupColor(d.markup) : 'var(--muted)'}">${d.markup ? d.markup.toFixed(1) + 'x' : '—'}</div>
        </div>
        <div class="info-pill">
          <div class="ip-label">Cals / pour</div>
          <div class="ip-val">${d.calories_per_pour || '—'}</div>
        </div>
      </div>

      ${apdHTML}
      ${pairingsHTML}

      ${d.flavor_profile ? `<div class="flavor">${d.flavor_profile}</div>` : ''}
      ${d.simple_comparison ? `<div class="compare">${d.simple_comparison}</div>` : ''}
    </div>`;
  }).join('');
}

// ── Screen switching ──────────────────────────────────────────────────────────
function showScreen(name) {
  document.getElementById('upload-screen').style.display   = name === 'upload'   ? 'flex'  : 'none';
  document.getElementById('progress-screen').style.display = name === 'progress' ? 'flex'  : 'none';
  document.getElementById('results-screen').style.display  = name === 'results'  ? 'block' : 'none';
}

// ── Event listeners ───────────────────────────────────────────────────────────
document.getElementById('new-btn').addEventListener('click', () => {
  clearFile();
  allDrinks = [];
  showScreen('upload');
});

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.pill');
  if (!btn) return;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  currentCat = btn.dataset.cat;
  renderCards();
});

document.getElementById('sorter').addEventListener('change', e => {
  currentSort = e.target.value;
  renderCards();
});

// Init
showScreen('upload');
</script>
</body>
</html>
